name: snake

on:
  schedule:
    - cron: "17 15 * * *" # 매일 00:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 공급망 안전을 위해 태그 대신 커밋 SHA로 고정한다 (Platane/snk v3.5.0)
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2c5ee8&color_dots=#eff2f5,#c9d6f7,#94aef0,#5f85ea,#2c5ee8
            dist/snake-dark.svg?palette=github-dark&color_snake=#9fb4d3&color_dots=#151b23,#1f2e45,#2e4569,#4d6a96,#7e98ba

      - name: output 브랜치에 올리기
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 프로필 활동을 비공개로 두면 잔디를 읽지 못해 빈 판이 나온다. 그때는 올리지 않고 전에 만든 그림을 그대로 둔다.
          if ! grep -q 'class="c c[0-9]' snake-dark.svg; then echo "빈 잔디라서 건너뜀"; exit 0; fi
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-light.svg snake-dark.svg
          git commit -q -m "snake ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
